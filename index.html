<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/cover_logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>¡Invitación al Multiverso! | Mateo Sebastian</title>
    <meta name="description" content="Acompáñanos a celebrar los 3 años de Mateo Sebastian. Confirma tu asistencia.">
  </head>
  <body>
    <div id="root"></div>
    <!-- Hidden form for Netlify Forms discovery in React SPA -->
    <form name="rsvp" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="rsvp" />
      <input type="text" name="nombre" />
      <input type="text" name="asistencia" />
      <input type="number" name="boletos" />
      <input type="text" name="bot-field" />
    </form>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
